<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReactPulse - see why your React components render</title>
    <meta
      name="description"
      content="ReactPulse (reactpulse-devtools) is a small React and React Native debugging and performance toolkit: render tracking, why-did-this-render, slow-render detection, leak warnings and a developer dashboard for web and native. React 18 and 19, Next.js, TypeScript."
    />
    <meta property="og:title" content="ReactPulse - see why your React components render" />
    <meta
      property="og:description"
      content="Render tracking, why-did-this-render, slow-render detection and a dev dashboard in about 4.5 KB gzip."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#4b57d6" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234b57d6'/%3E%3Cpath d='M5 17h5l3-8 5 14 3-6h6' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      // Set the theme before first paint to avoid a flash.
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("rp-site-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
